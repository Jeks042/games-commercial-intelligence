name: Validate commercial model
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "sql/**"
      - "requirements.txt"
      - "docs/metric-dictionary.csv"
      - "docs/benchmark-metrics.csv"
      - "data/accepted-runs.json"
      - "data/title-references.csv"
      - "data/benchmarking-contract.json"
      - "data/price-history/**"
      - "data/player-reviews/**"
      - "data/analytical/**"
      - "data/portfolio-titles.csv"
      - "data/competitor-titles.csv"
      - "data/runs/**"
      - ".github/workflows/**"
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Test acquisition and analytical contracts
        run: python -m unittest discover -s tests -v
      - name: Build quality-gated analytical release
        run: python src/build_model.py
      - name: Verify an identical rerun
        run: |
          cp data/analytical/current.json /tmp/model-current.json
          python src/build_model.py
          cmp /tmp/model-current.json data/analytical/current.json
      - name: Build portfolio positioning from the accepted model
        run: python src/benchmark_portfolio.py
      - name: Verify identical positioning rerun
        run: |
          cp data/positioning/current.json /tmp/positioning-current.json
          python src/benchmark_portfolio.py
          cmp /tmp/positioning-current.json data/positioning/current.json
      - name: Verify pricing analysis when a reviewed history run exists
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from price_history import ROOT, build_analysis
          from pricing_context import build as build_price_context
          register = json.loads((ROOT / "data/price-history/accepted-runs.json").read_bytes())
          if register["accepted_runs"]:
              build_analysis()
              pointer = ROOT / "data/pricing-analysis/current.json"
              before = pointer.read_bytes()
              build_analysis()
              assert before == pointer.read_bytes()
              build_price_context()
              context_pointer = ROOT / "data/pricing-review/current.json"
              context_before = context_pointer.read_bytes()
              build_price_context()
              assert context_before == context_pointer.read_bytes()
          else:
              print("Pricing analysis unavailable: no reviewed history run. Source foundation tests passed separately.")
          PY
      - name: Verify player-review analysis when a reviewed coded run exists
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from review_analysis import ROOT, build
          register = json.loads((ROOT / "data/player-reviews/accepted-runs.json").read_bytes())
          if register["accepted_runs"]:
              build()
              pointer = ROOT / "data/review-analysis/current.json"
              before = pointer.read_bytes()
              build()
              assert before == pointer.read_bytes()
          else:
              print("Player-review analysis unavailable: no reviewed coded run.")
          PY
      - name: Retain model release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytical-model-${{ github.run_id }}
          path: |
            data/analytical/
            data/positioning/
            data/price-history/
            data/pricing-analysis/
            data/pricing-review/
            data/player-reviews/
            data/review-analysis/
          retention-days: 90
          if-no-files-found: error
