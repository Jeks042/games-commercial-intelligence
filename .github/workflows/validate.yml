name: Validate commercial model
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "sql/**"
      - "requirements.txt"
      - "docs/metric-dictionary.csv"
      - "docs/benchmark-metrics.csv"
      - "data/accepted-runs.json"
      - "data/title-references.csv"
      - "data/benchmarking-contract.json"
      - "data/analytical/**"
      - "data/portfolio-titles.csv"
      - "data/competitor-titles.csv"
      - "data/runs/**"
      - ".github/workflows/**"
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Test acquisition and analytical contracts
        run: python -m unittest discover -s tests -v
      - name: Build quality-gated analytical release
        run: python src/build_model.py
      - name: Verify an identical rerun
        run: |
          cp data/analytical/current.json /tmp/model-current.json
          python src/build_model.py
          cmp /tmp/model-current.json data/analytical/current.json
      - name: Build portfolio positioning from the accepted model
        run: python src/benchmark_portfolio.py
      - name: Verify identical positioning rerun
        run: |
          cp data/positioning/current.json /tmp/positioning-current.json
          python src/benchmark_portfolio.py
          cmp /tmp/positioning-current.json data/positioning/current.json
      - name: Retain model release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analytical-model-${{ github.run_id }}
          path: |
            data/analytical/
            data/positioning/
          retention-days: 90
          if-no-files-found: error
